<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Headz-up · kreativní studio</title>
  <meta name="description" content="Headz-up — strategie, identita a digitál. Studio, které přemýšlí napřed." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
  <meta name="ext-resource-dependency" content="assets/team.webp" data-resource-id="teamPhoto" />
</head>
<body>
  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
      <rect width="400" height="300" fill="#E3F536"/>
      <text x="200" y="170" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="64" font-weight="700" fill="#141C1F" letter-spacing="-3">headz-up</text>
    </svg>
  </template>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="page-home.jsx"></script>
  <script type="text/babel" src="page-onas.jsx"></script>
  <script type="text/babel" src="page-projekty.jsx"></script>
  <script type="text/babel" src="page-detail.jsx"></script>
  <script type="text/babel" src="page-kontakt.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { NavBar, Footer } = window.UI;

    function App() {
      const [route, setRoute] = useState(window.location.hash.replace(/^#/, "") || "/");

      useEffect(() => {
        const onHash = () => {
          setRoute(window.location.hash.replace(/^#/, "") || "/");
          window.scrollTo({ top: 0, behavior: "instant" });
        };
        window.addEventListener("hashchange", onHash);
        return () => window.removeEventListener("hashchange", onHash);
      }, []);

      const navigate = (to) => {
        window.location.hash = to;
      };

      // Route matching
      const detailMatch = route.match(/^\/projekty\/([\w-]+)$/);
      let page;
      let transparentOver = false;
      let labelKey = route;
      if (route === "/" || route === "") {
        page = <window.Home navigate={navigate} />;
        transparentOver = true;
        labelKey = "01 Homepage";
      } else if (route === "/o-nas") {
        page = <window.ONas navigate={navigate} />;
        labelKey = "02 O nas";
      } else if (route === "/projekty") {
        page = <window.Projekty navigate={navigate} />;
        labelKey = "03 Projekty";
      } else if (detailMatch) {
        page = <window.ProjectDetail slug={detailMatch[1]} navigate={navigate} />;
        labelKey = "04 Detail " + detailMatch[1];
      } else if (route === "/kontakt") {
        page = <window.Kontakt navigate={navigate} />;
        labelKey = "05 Kontakt";
      } else {
        page = (
          <div style={{ paddingTop: 220, textAlign: "center" }}>
            <p className="mono">404 — strana nenalezena</p>
            <button onClick={() => navigate("/")} className="mono ul-link">← na úvod</button>
          </div>
        );
        labelKey = "404";
      }

      return (
        <div data-screen-label={labelKey}>
          <NavBar route={route} navigate={navigate} transparentOver={transparentOver} />
          <main key={route}>{page}</main>
          <Footer navigate={navigate} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
